spring:
  main:
    allow-bean-definition-overriding: true
    allow-circular-references: true
  application:
    name: looter
  datasource:
    hikari:
      jdbc-url: ${LOOTER_SCRAP_JDBC_URL}
      username: ${LOOTER_SCRAP_DB_USERNAME}
      password: ${LOOTER_SCRAP_DB_PASSWORD}
      driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: none
      naming:
        physical-strategy: org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
    show-sql: false
  batch:
    job:
      enabled: false
    jdbc:
      initialize-schema: never

server:
  port: 5001

logging:
  level:
    com:
      sleeved:
        looter: DEBUG
    org:
      springframework:
        retry: DEBUG

looter:
  batch:
    chunksize: ${LOOTER_BATCH_CHUNK_SIZE}
    chunksize-hash: ${LOOTER_BATCH_CHUNK_SIZE_HASH}
  staging:
    datasource:
      jdbc-url: ${LOOTER_STAGING_JDBC_URL}
      username: ${LOOTER_STAGING_DB_USERNAME}
      password: ${LOOTER_STAGING_DB_PASSWORD}
      driver-class-name: com.mysql.cj.jdbc.Driver

atlas:
  datasource:
    jdbc-url: ${SLEEVED_DB_JDBC_URL}
    username: ${SLEEVED_DB_USERNAME}
    password: ${SLEEVED_DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

iris:
  datasource:
    jdbc-url: ${IRIS_DB_JDBC_URL}
    username: ${IRIS_DB_USERNAME}
    password: ${IRIS_DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  api:
    url:
      protocole: ${IRIS_API_PROTOCOLE}
      domain: ${IRIS_API_DOMAIN_URL}
      base: ${IRIS_API_BASE_URL}
      endpoint:
        hash: ${IRIS_API_ENDPOINT_HASH}

tcgplayer:
  api:
    key: ${TCGPLAYER_API_KEY}
    url:
      protocole: ${TCG_API_PROTOCOLE}
      domain: ${TCG_API_DOMAIN_URL}
      base: ${TCG_API_BASE_URL}
    retry:
      max-attempts: 3
      initial-delay: 1000
      backoff-multiplier: 2.0
      max-delay: 10000
    endpoints:
      cards:
        paginate: cards?page=%d&pageSize=%d&orderBy=set.releaseDate
        paginate-prices: cards?page=%d&pageSize=%d&orderBy=set.releaseDate&select=id,name,tcgplayer,cardmarket
        pagesize: 200
        page: ${TCG_API_INTIAL_PAGE}
